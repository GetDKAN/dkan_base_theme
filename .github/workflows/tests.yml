# PHPUnit unit and kernel suites on a ddev Drupal 11 + DKAN site. The kernel
# tests extend dkan_catalog_ui's test base, so its main branch is checked out
# alongside.
name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
      - name: Create a DKAN project
        run: |
          mkdir site && cd site
          ddev config --project-type=drupal11 --docroot=web --project-name=ci --php-version=8.4 \
            --web-environment-add=SIMPLETEST_BASE_URL=http://localhost,SIMPLETEST_DB=mysql://db:db@db/db
          ddev start
          ddev composer create-project drupal/recommended-project:^11 --no-interaction
          ddev composer config minimum-stability dev
          ddev composer config prefer-stable true
          ddev composer require drupal/dkan:^4 drupal/facets:^3 drupal/search_api:^1 drush/drush:^13 \
            --no-interaction --with-all-dependencies
          ddev composer require --dev drupal/core-dev:^11 --no-interaction --with-all-dependencies
      - uses: actions/checkout@v4
        with:
          repository: GetDKAN/dkan_catalog_ui
          path: site/web/modules/custom/dkan_catalog_ui
      - uses: actions/checkout@v4
        with:
          path: site/web/themes/custom/dkan_base_theme
      - name: PHPUnit
        run: cd site && ddev exec vendor/bin/phpunit -c web/themes/custom/dkan_base_theme
